name: Stale
on:
  schedule:
    - cron: '30 1 * * *'   # daily; schedules only run from the default branch
  workflow_dispatch:
permissions:
  actions: write   # the action keeps its state in the Actions cache
  issues: write
  pull-requests: write
jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v11
        with:
          days-before-stale: 60
          days-before-close: 14
          exempt-issue-labels: pinned,security
          exempt-pr-labels: pinned
          stale-issue-message: 'No activity for 60 days. This closes in 14 days unless someone comments.'
          stale-pr-message: 'No activity for 60 days. This closes in 14 days unless someone comments.'
